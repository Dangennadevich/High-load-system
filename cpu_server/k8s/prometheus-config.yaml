apiVersion: v1
kind: ConfigMap 
metadata:
  name: prometheus-server
  namespace: default
data:
  alerting_rules.yml: |
    {}
  alerts: |
    {}
  allow-snippet-annotations: "false"
  prometheus.yml: |
    global:
      evaluation_interval: 1m
      scrape_interval: 1m
      scrape_timeout: 10s
    rule_files:
    - /etc/config/recording_rules.yml
    - /etc/config/alerting_rules.yml
    - /etc/config/rules
    - /etc/config/alerts
    scrape_configs:
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['31.130.151.173:9100']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']